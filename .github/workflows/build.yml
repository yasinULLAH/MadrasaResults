name: Build Offline APK and Portable EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Offline Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android Project and Capacitor
        run: |
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          npx cap init "Madrasa Results" "com.yasinbss.madrasaresults" --web-dir "."
          npx cap add android
          mkdir -p android/app/src/main/assets/public
          cp index.html android/app/src/main/assets/public/
          cp xlsx.full.min.js android/app/src/main/assets/public/
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MadrasaResults-Offline.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadrasaResults-Android-APK
          path: release-output/MadrasaResults-Offline.apk
          retention-days: 30

  build-windows-exe:
    name: Build Standalone Windows Portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Electron and Builder
        run: |
          npm install electron@30.0.0 electron-builder@24.13.3 --save-dev

      - name: Build Portable Windows EXE
        run: |
          npx electron-builder --win portable

      - name: Upload Windows Portable EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadrasaResults-Windows-Portable-EXE
          path: dist/*.exe
          retention-days: 30
