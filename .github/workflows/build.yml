name: Build Offline APK and Portable EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Offline Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Android Project and Capacitor
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp xlsx.full.min.js www/xlsx.full.min.js
          npm install @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0
          npx cap init "Madrasa Results" "com.yasinbss.madrasaresults" --web-dir "www"
          npx cap add android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/MadrasaResults-Offline.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadrasaResults-Android-APK
          path: release-output/MadrasaResults-Offline.apk
          retention-days: 30

  build-windows-exe:
    name: Build Standalone Windows Portable EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Electron and Builder
        run: |
          npm install electron@30.0.0 electron-builder@24.13.3 --save-dev

      - name: Build Portable Windows EXE
        run: |
          npx electron-builder --win portable

      - name: Upload Windows Portable EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MadrasaResults-Windows-Portable-EXE
          path: dist/*.exe
          retention-days: 30

  create-release:
    name: Publish GitHub Release
    needs: [build-apk, build-windows-exe]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: MadrasaResults-Android-APK
          path: release-assets

      - name: Download Windows Portable EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: MadrasaResults-Windows-Portable-EXE
          path: release-assets

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Madrasa Results v1.0.0 — Production Release"
          body: |
            ## Madrasa Examination & Result Management System
            ### جامعہ و مدارس امتحانی نظام و نتائج

            Downloadable standalone offline binaries:
            - **Android APK**: `MadrasaResults-Offline.apk`
            - **Windows Portable EXE**: Standalone Portable Executable (runs without installation)

            ### Features Included
            - Complete CRUD for Classes (درجات)
            - Complete CRUD for Exam Sessions (امتحانات)
            - Calibri styled Excel exports
            - 6 Professional Print Center templates
            - WhatsApp result sharing
            - Offline LocalStorage and JSON Backup/Restore
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
